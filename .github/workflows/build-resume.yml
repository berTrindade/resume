name: Build Resume

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup htmldocs authentication
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p ~/.htmldocs
          echo '{"api_key":"${{ secrets.HTMLDOCS_API_KEY }}","team_id":"${{ secrets.HTMLDOCS_TEAM_ID }}"}' > ~/.htmldocs.json

      - name: Publish resume to htmldocs cloud
        if: github.ref == 'refs/heads/main'
        run: npx htmldocs@latest publish documents/Resume.tsx

      - name: Generate PDF from htmldocs API
        if: github.ref == 'refs/heads/main'
        env:
          HTMLDOCS_API_KEY: ${{ secrets.HTMLDOCS_API_KEY }}
        run: npm run build:pdf

      - name: Semantic Release
        if: github.ref == 'refs/heads/main'
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      - name: Check if PDF exists
        if: github.ref == 'refs/heads/main'
        run: ls -lh Resume.pdf

      - name: Upload PDF to latest release
        if: github.ref == 'refs/heads/main'
        run: |
          LATEST_TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName')
          echo "Uploading Resume.pdf to release $LATEST_TAG"
          gh release upload "$LATEST_TAG" Resume.pdf --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
